# Lancement complet : docker compose up --build
# Application : http://localhost:8080   API : http://localhost:8000/api/health

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: credittrack
      POSTGRES_USER: credittrack
      POSTGRES_PASSWORD: credittrack
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credittrack -d credittrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql://credittrack:credittrack@db:5432/credittrack?serverVersion=16&charset=utf8"
      APP_SECRET: "${APP_SECRET:-change_me_in_production}"
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
