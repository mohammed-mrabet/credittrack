name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Symfony)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: credittrack
          POSTGRES_USER: credittrack
          POSTGRES_PASSWORD: credittrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U credittrack"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: "postgresql://credittrack:credittrack@127.0.0.1:5432/credittrack?serverVersion=16&charset=utf8"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.json', 'backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Tests unitaires
        run: vendor/bin/phpunit

      - name: Migrations et schéma
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate

      - name: Test de fumée de l'API
        run: |
          php bin/console app:seed
          php -S 127.0.0.1:8000 -t public > /dev/null 2>&1 &
          sleep 2
          curl -sf http://127.0.0.1:8000/api/health
          curl -sf "http://127.0.0.1:8000/api/invoices?status=overdue" | grep -q '"status":"overdue"'
          curl -sf http://127.0.0.1:8000/api/dashboard | grep -q collectionRate

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Tests unitaires
        run: npm run test:ci
      - name: Build de production
        run: npx ng build --configuration production

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build des images
        run: docker compose build
      - name: Démarrage et vérification
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health && break; sleep 2; done
          curl -sf http://localhost:8080/api/dashboard | grep -q collectionRate
          curl -sf http://localhost:8080/ | grep -q "<app-root"
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
